name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - phase/**

jobs:
  test-package-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test
        run: ./mvnw test

      - name: Package
        run: ./mvnw package

      - name: Docker build
        run: docker build -t rippleguard-loan-service:ci .
